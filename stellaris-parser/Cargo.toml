[package]
name = "stellaris-parser"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "stellaris-parser"
path = "src/main.rs"

[dependencies]
jomini = { version = "0.23", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
