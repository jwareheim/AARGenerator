name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-cargo-${{ hashFiles('stellaris-parser/Cargo.lock') }}

      - name: Build Linux binary
        working-directory: stellaris-parser
        run: cargo build --release

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: stellaris-parser/target/release/stellaris-parser

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: windows-cargo-${{ hashFiles('stellaris-parser/Cargo.lock') }}

      - name: Build Windows binary
        working-directory: stellaris-parser
        run: cargo build --release

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: stellaris-parser\target\release\stellaris-parser.exe
